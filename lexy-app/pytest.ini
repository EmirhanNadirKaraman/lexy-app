[pytest]
# pytest-randomly is disabled repo-side: it forwards an UNMASKED seed
# (session seed + per-test crc32 offset, which routinely exceeds 2**32-1)
# to `pytest_randomly.random_seeder` entry points. spaCy's thinc registers
# `thinc.api:fix_random_seed` there, which calls `numpy.random.seed()`
# directly -- and numpy rejects any seed >= 2**32. Result when the plugin
# is installed in the environment: ValueError at setup AND teardown of
# nearly every test. We do not depend on the plugin; block it here so a
# plain `pytest` run is correct regardless of what's in site-packages.
addopts = -p no:randomly
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = backend/tests
