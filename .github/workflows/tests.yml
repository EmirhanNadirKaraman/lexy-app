name: Tests

# The validation commands CLAUDE.md §11 and docs/TESTS.md already call mandatory
# for a Python change, run as a gate instead of on trust. Two of the three run
# here, one per job so a failure names its own suite:
#
#   ruff check .                    -> lint
#   python3 -m pytest tests/        -> pipeline   (root pipeline + subtitle-scraper)
#
# THE THIRD IS DELIBERATELY ABSENT: `cd lexy-app/backend && python3 -m pytest
# -n auto`. Every backend test pulls the autouse `cleanup` fixture
# (lexy-app/backend/tests/conftest.py:67), which takes `db_pool`, so the suite
# needs a live Postgres and there is no database-free subset to gate on. That
# database cannot be built from this repository: `video`, `word_table` and eight
# more tables are ALTERed by migrations but never CREATEd (006_video_channel_genre.py:16
# runs `ALTER TABLE video ADD COLUMN …`; no `CREATE TABLE video` exists in any of
# the 37 revisions), so `alembic upgrade head` fails at revision 006 on an empty
# database. That is audit blocker hb-01 (docs/AUDIT_2026-07-30.md) and it needs a
# human decision, not a workflow edit. A job that cannot pass would make this gate
# red from its first run and teach everyone to ignore it, so it is not written
# here — not as a skipped job either, since "skipped" reads as success to branch
# protection. When hb-01 is resolved, the job to add is: a `postgres:16` service
# container, `alembic upgrade head` from lexy-app/backend, then
# `python3 -m pytest -n auto` with DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
# pointing at that service.
#
# Frontend vitest is out of scope for this workflow (it is not one of the Python
# validation commands); `npm audit` and `pip-audit` live in dependency-audit.yml.
#
# A THIRD JOB, `docs`, guards this repository's own documentation trackers. It is
# not one of the validation commands: it exists because the checks it performs
# used to arrive from OUTSIDE this repository. `autoloop/tests/test_docs_merge.py`
# and `autoloop/tests/test_audit_charters.py` assert things about `docs/` here —
# tracker shape, change-note length, the charter file — and ran in the autoloop
# job this workflow no longer has. Once that package is maintained elsewhere its
# suite is rooted at ITS checkout, not this one, so those assertions stop being
# about these files. Re-stating the mechanical half here puts them back in the
# repository that owns the files.
#
# READ THIS BEFORE TREATING IT AS EQUIVALENT COVER. The `on:` block above is
# `main` only, and the loop merges into `autoloop/mainline` — so the case these
# rules exist for, two parallel task branches each appending a change note, is
# NOT gated by this job; it is gated only when that work later reaches `main`.
# Widening the trigger is not the fix: `on:` is workflow-level, so naming the
# loop's branch would also run `lint` and `pipeline` on every loop merge. The
# real restoration is a test under `tests/`, tracked as docs/TODO.md #45. See
# docs/TESTS.md "What the autoloop job used to guard" for the full accounting of
# what is preserved, what is not, and the branch-protection caveat.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded push to the same ref does not need its old run finished.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check . (repo root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff at the repo's pinned version
        # The pin lives in lexy-app/backend/requirements.txt and is deliberate —
        # ruff's rule set shifts between releases, so an unpinned ruff reports
        # differently machine-to-machine (see /ruff.toml). Reading the pin from
        # that file keeps one source of truth: a bump there moves CI with it, and
        # a missing pin fails this step loudly rather than installing whatever is
        # newest.
        run: |
          pin=$(grep -E '^ruff==' lexy-app/backend/requirements.txt)
          echo "Installing $pin"
          pip install "$pin"
      - name: ruff check .
        # From the repo root, not lexy-app/backend — /ruff.toml covers backend,
        # scraper, root pipeline, scripts, masking and ilp in one pass. Baseline
        # is zero findings, so any output at all is a regression.
        run: ruff check .

  pipeline:
    name: pytest tests/ (root pipeline + scraper)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            lexy-app/backend/requirements.txt
      - name: Install dependencies
        # Root requirements.txt is `-r lexy-app/backend/requirements.txt`, i.e.
        # the full backend set. Installing the superset is deliberate: the root
        # tests load subtitle-scraper and pipeline modules by file path, so their
        # transitive imports are not enumerable from the test files themselves.
        run: pip install -r requirements.txt
      - name: Download spaCy models
        # de_core_news_sm is NOT optional: subtitle-scraper/phrase_finder.py:15
        # calls spacy.load at module scope, so without it the scraper half of the
        # suite dies at collection rather than skipping. The other two back
        # fixtures that DO skip cleanly when the model is missing — installed
        # anyway, because a green job that quietly skipped a third of its
        # assertions is exactly the drift this workflow exists to catch.
        # (en_core_web_sm is only asserted as a config string in
        # tests/test_language_config.py:47 — never loaded, so not installed.)
        run: |
          python -m spacy download de_core_news_sm
          python -m spacy download de_core_news_md
          python -m spacy download es_core_news_sm
      - name: pytest tests/
        # `python3 -m pytest`, not the bare console script: `python -m` puts the
        # cwd on sys.path, which the by-path module loading in tests/ relies on.
        # Same reason the backend command is written that way (docs/COMMON_ERRORS.md §2).
        # Root pytest.ini supplies `-p no:randomly -m "not isolated"`.
        run: python3 -m pytest tests/ -q

  docs:
    name: docs guards (change-note trackers + audit charters)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tracker sections, change-note length, charter file
        # Stdlib only, no install step: `tomllib` is stdlib from 3.11 and the
        # rest is pathlib. A guard that needs a dependency resolved is a guard
        # that can be skipped by a broken index.
        run: |
          python3 - <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          # LITERAL paths, never a glob over docs/. A glob that matches nothing
          # passes silently, and "the file was renamed" is exactly the state
          # this job has to fail on rather than sail past.
          TRACKERS = (
              "docs/COMMON_ERRORS.md",
              "docs/SECURITY.md",
              "docs/SUMMARY.md",
              "docs/TESTS.md",
          )
          MARKER = "<!-- CHANGE-NOTES:"

          # A MIRROR of the harness's `note_merge.MAX_NOTE_LINE_CHARS`, which is
          # the authority and lives with that package. Copying a constant is
          # normally the wrong move (CLAUDE.md §12 says so about this exact
          # number), but after the split there is no local source to read and the
          # alternative is no check at all. The dangerous direction is a LAX
          # copy: a note this job passes and the harness then refuses throws away
          # the whole round. If the two ever disagree, the harness wins — raise
          # this only after reading the constant there.
          MAX_NOTE_LINE_CHARS = 700

          CHARTERS = "docs/audit_charters.toml"
          CHARTER_SLUGS = (
              "docs_drift",
              "tests_ci",
              "repo_structure",
              "security_paths",
              "db_migrations",
              "ingestion_pipeline",
          )
          CHARTER_FIELDS = {"slug", "title", "charter", "model"}
          CHARTER_MODELS = {"haiku", "sonnet", ""}

          problems = []
          checked = 0

          for rel in TRACKERS:
              path = Path(rel)
              if not path.is_file():
                  problems.append(rel + ": missing, and every task is told to record its note here")
                  continue
              checked += 1
              text = path.read_text(encoding="utf-8")
              if not text.endswith("\n"):
                  problems.append(rel + ": no trailing newline, so the next note continues the last line")
              markers = text.count(MARKER)
              if markers != 1:
                  problems.append(
                      rel + ": " + str(markers) + " CHANGE-NOTES markers, not 1. A second copy "
                      "switches auto-resolution off for the whole file, silently; name the marker "
                      "CHANGE-NOTES in prose instead of writing the comment out again."
                  )
                  continue
              lines = text.split(MARKER, 1)[1].splitlines()[1:]
              body = [ln for ln in lines if ln.strip()]
              if not body:
                  problems.append(rel + ": nothing after its CHANGE-NOTES marker")
                  continue
              if any(ln.startswith("#") for ln in lines):
                  problems.append(rel + ": a heading after the marker, so later notes land inside it")
              if not body[-1].startswith("| "):
                  problems.append(rel + ": must end on a note row, not " + repr(body[-1][:60]))
              if "| Date | Task | Note |" not in body:
                  problems.append(rel + ": no note-table header below the marker")
              for offset, line in enumerate(lines, 1):
                  if len(line) > MAX_NOTE_LINE_CHARS:
                      problems.append(
                          rel + ": the note " + str(offset) + " lines below the marker is "
                          + str(len(line)) + " characters, over the " + str(MAX_NOTE_LINE_CHARS)
                          + "-character limit measured over the WHOLE line. Append a second line."
                      )

          # Fail closed on the SET, not only on the contents: a loop that checked
          # nothing must not report success.
          if checked != len(TRACKERS):
              problems.append(
                  "checked " + str(checked) + " of " + str(len(TRACKERS))
                  + " trackers; an unchecked tracker is not a passing one"
              )

          charters = Path(CHARTERS)
          parsed = None
          if charters.exists() and not charters.is_file():
              # A directory here is NOT absence, and saying "missing" would send
              # the reader looking for a deleted file.
              problems.append(CHARTERS + ": exists but is not a regular file")
          elif not charters.is_file():
              problems.append(
                  CHARTERS + ": missing. Absence is a SUPPORTED state for the audit (it falls back "
                  "to built-in domains), so losing this file is invisible from the harness side."
              )
          else:
              try:
                  parsed = tomllib.loads(charters.read_text(encoding="utf-8"))
              except (tomllib.TOMLDecodeError, UnicodeDecodeError) as exc:
                  problems.append(CHARTERS + ": does not parse, which ABORTS an audit run: " + str(exc))

          if parsed is not None:
              domains = parsed.get("domain")
              if not isinstance(domains, list) or not domains:
                  problems.append(CHARTERS + ": no [[domain]] tables")
              else:
                  slugs = tuple(d.get("slug") for d in domains if isinstance(d, dict))
                  if slugs != CHARTER_SLUGS:
                      problems.append(
                          CHARTERS + ": domains " + str(list(slugs)) + ", expected "
                          + str(list(CHARTER_SLUGS)) + " in wave order"
                      )
                  for domain in domains:
                      if not isinstance(domain, dict):
                          problems.append(CHARTERS + ": a [[domain]] entry is not a table")
                          continue
                      slug = repr(domain.get("slug"))
                      if set(domain) != CHARTER_FIELDS:
                          problems.append(
                              CHARTERS + ": " + slug + " has fields " + str(sorted(domain))
                              + ", expected " + str(sorted(CHARTER_FIELDS))
                          )
                      if domain.get("model") not in CHARTER_MODELS:
                          problems.append(
                              CHARTERS + ": " + slug + " model " + repr(domain.get("model"))
                              + " is not haiku, sonnet or empty"
                          )
                      if not str(domain.get("charter", "")).strip():
                          problems.append(CHARTERS + ": " + slug + " has an empty charter")

          if problems:
              print("docs guards FAILED:")
              for problem in problems:
                  print("  - " + problem)
              sys.exit(1)

          print(
              "ok: " + str(checked) + " change-note trackers well formed, every note line "
              "<= " + str(MAX_NOTE_LINE_CHARS) + " chars, " + str(len(CHARTER_SLUGS))
              + " audit charters parse."
          )
          PY
