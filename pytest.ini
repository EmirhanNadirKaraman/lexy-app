[pytest]
# See lexy-app/pytest.ini for the full rationale: pytest-randomly hands an
# unmasked seed to thinc's `fix_random_seed` entry point, numpy rejects
# anything >= 2**32, and every test errors at setup/teardown. Blocked here
# so the root pipeline suite is immune to the plugin being installed.
addopts = -p no:randomly
testpaths = tests
