[pytest]
# See lexy-app/pytest.ini for the full rationale: pytest-randomly hands an
# unmasked seed to thinc's `fix_random_seed` entry point, numpy rejects
# anything >= 2**32, and every test errors at setup/teardown. Blocked here
# so the root pipeline suite is immune to the plugin being installed.
#
# BOTH halves of `addopts` are load-bearing and neither may be dropped while
# "removing the other one":
#   * `-p no:randomly`      — the seed conflict above. This clamp is the whole
#     reason this file exists; it is unrelated to what `testpaths` selects, and
#     losing it while editing the line it shares is the one way to break this
#     suite with a change that looked purely subtractive.
#   * `-m "not isolated"`   — keeps a test that is correct alone but flaky in
#     company out of the shared run. See the `markers` note at the bottom for
#     why this stays even though nothing under `tests/` carries the marker
#     today.
addopts = -p no:randomly -m "not isolated"

# The default test surface for a bare `pytest` at the repo root: this
# repository's own root pipeline modules, and nothing else.
#
# The loop harness that used to be collected here is no longer part of this
# repository's test surface — it is owned, linted and tested elsewhere, and it
# imports nothing from this repository. A bare `pytest` here therefore collects
# the pipeline suite alone; it no longer reports on a tree this repository does
# not maintain.
#
# THE OTHER DIRECTION IS NOT CLEAN, AND THIS FILE DOES NOT MAKE IT SO. Exactly
# one file outside `autoloop/` imports the package:
# `scripts/seed_validation_db.py:48`, `from autoloop.validation_env import
# repo_declared_db_name`. Nothing under `tests/` imports that script, so the
# suite this file selects was never evidence about it either way — dropping the
# tree from `testpaths` neither created that edge nor covers it. Lift the import
# BEFORE `autoloop/` leaves the checkout: docs/TODO.md #46, and Step 0 of
# `docs/AUTOLOOP_REMOVAL.md`.
#
# NOT covered by a bare run (each needs its own command — see the validation
# table in docs/TESTS.md):
#   * lexy-app/backend/tests — has its own ini (asyncio settings) and needs a
#     live Postgres: `cd lexy-app/backend && python3 -m pytest -n auto`
#   * lexy-app/frontend — vitest, not pytest: `npx vitest run`
#
# Adding a tree here: `tests/` is a package (`__init__.py`), so any tree added
# alongside it must keep test-module basenames unique across both, or
# prepend-import collection fails on the duplicate module name.
testpaths = tests

# `isolated` marks a test that is correct on its own but flaky INSIDE a
# full-suite run — it must therefore be run in its own process, not deleted.
#
# NOTHING UNDER `tests/` CARRIES THIS MARKER TODAY, so both the deselection in
# `addopts` and this declaration are currently inert here. They are kept rather
# than deleted, deliberately:
#
#   * The declaration is what makes a typo an error instead of a silent
#     no-match, so it must land BEFORE the first marked test, not after.
#   * Deleting an inert marker is a one-line change; discovering later that a
#     flaky test was merged because the deselection had been tidied away is
#     not. Registering the marker costs nothing when unused.
#
# Parallelism belongs on the command, never in `addopts`: `-n auto` here would
# reach every invocation, including any run whose whole point is to give one
# test a process of its own. Keep this file free of `-n` / `--numprocesses`.
#
# Adding a marker to a test is a claim that the test is sound and its
# NEIGHBOURS perturb it. Establish that first (run it alone, many times, under
# load) before reaching for this — otherwise it hides a real defect behind a
# label.
markers =
    isolated: run in a dedicated pytest process; flaky only alongside the full suite
