[pytest]
# See lexy-app/pytest.ini for the full rationale: pytest-randomly hands an
# unmasked seed to thinc's `fix_random_seed` entry point, numpy rejects
# anything >= 2**32, and every test errors at setup/teardown. Blocked here
# so the root pipeline suite is immune to the plugin being installed.
#
# Both halves of `addopts` are load-bearing, and they arrived from different
# branches that each changed only one line — merged by hand 2026-08-04:
#   * `-p no:randomly`      — the seed conflict above.
#   * `-m "not isolated"`   — keeps the flaky-in-company test out of the shared
#     run. This became MORE important, not less, when `autoloop/tests` joined
#     `testpaths` below: that is the tree the isolated test lives in, so
#     expanding the default surface without this marker would have walked the
#     flake straight back into every bare `pytest` run.
addopts = -p no:randomly -m "not isolated"

# The default test surface for a bare `pytest` at the repo root: the root
# pipeline modules AND the autoloop loop harness. `autoloop/tests` used to be
# reachable only by naming it explicitly, so a bare run reported a green root
# suite while the entire loop suite had silently not been collected.
#
# Both trees are hermetic — no database, no network, no real `claude` CLI —
# and the autoloop tests derive every state dir, worker root and lock path
# from `tmp_path`, so a bare run cannot disturb a live loop's `~/.autoloop`.
# They do shell out to real `git` and spawn real subprocesses, so expect a
# bare run to take minutes rather than seconds.
#
# NOT covered by a bare run (each needs its own command — see the validation
# table in docs/TESTS.md):
#   * lexy-app/backend/tests — has its own ini (asyncio settings) and needs a
#     live Postgres: `cd lexy-app/backend && python3 -m pytest -n auto`
#   * lexy-app/frontend — vitest, not pytest: `npx vitest run`
#
# Adding a tree here: `tests/` is a package (`__init__.py`), `autoloop/tests`
# is not, so autoloop test-module basenames must stay unique across both
# trees or prepend-import collection fails on the duplicate module name.
testpaths = tests autoloop/tests

# `isolated` marks a test that is correct on its own but flaky INSIDE a
# full-suite run — it must therefore be run in its own process, not deleted.
# The default `-m "not isolated"` keeps it out of the shared run; the loop's
# validation runs it separately, so the coverage is still enforced:
#
#     python3 -m pytest autoloop/tests -q -m isolated -p no:cacheprovider
#
# Adding a marker here is a claim that the test is sound and its NEIGHBOURS
# perturb it. Establish that first (run it alone, many times, under load)
# before reaching for this — otherwise it hides a real defect behind a label.
markers =
    isolated: run in a dedicated pytest process; flaky only alongside the full suite
