# Autoloop configuration template.
# Copy to .autoloop/config.toml (the default path `python -m autoloop` reads)
# and fill in browser.conversation_url. Unknown keys are rejected, not ignored.

[browser]
# The ONE persistent ChatGPT conversation the loop uses. Open the dedicated
# profile, create a chat, copy its URL.
conversation_url = "https://chatgpt.com/c/REPLACE-ME"
# The ChatGPT project that conversation belongs to. Required ONLY for
# conversation rotation: when a chat becomes unusable, or two sends in a row are
# positively disproven, the loop opens ONE replacement chat here and rebinds the
# in-flight request to it. Leave empty to disable rotation entirely (the loop
# then parks for you instead). Set explicitly rather than derived from
# conversation_url — a guessed project URL opens chats somewhere you did not
# choose.
project_url = ""
# Chrome DevTools endpoint of the dedicated profile (see docs/AUTOLOOP.md for
# the launch command).
cdp_url = "http://127.0.0.1:9222"
# Every wait is bounded separately so a stuck channel fails fast with a
# specific diagnosis instead of hanging on one giant timeout.
composer_timeout_seconds = 30.0     # composer element ready
input_sync_timeout_seconds = 30.0   # editor really holds the whole request
send_ready_timeout_seconds = 30.0   # Send control enabled
submit_timeout_seconds = 60.0       # evidence the server accepted the turn
response_start_timeout_seconds = 120.0  # assistant begins answering
response_timeout_seconds = 900.0    # a started answer settles
reconcile_timeout_seconds = 30.0    # persisted-history check after a reload
poll_interval_seconds = 2.0
# The answer must be unchanged this long (and generation stopped) to count.
stability_seconds = 3.0
# How the loop restarts Chrome after a session loss. Empty (or absent) disables
# auto-restart — the loop then parks and asks you to relaunch the profile.
#
# Declared, never inferred: the loop knows a cdp_url, not which Chrome owns it,
# and an automation that pattern-matched process lists would eventually kill
# someone's everyday browser. The shipped module matches `--user-data-dir`
# EXACTLY (never the binary name), stops EVERY instance on that profile, waits
# for the debug port to actually free, and only reports success once the
# endpoint answers with a browser websocket URL — see
# autoloop/browser/chrome_restart.py. It replaced a shell helper that stopped
# one pid and relaunched into a survivor still holding the port, reporting
# success every time (docs/COMMON_ERRORS.md).
#
# Two things to know: `-m` resolves `autoloop` from the WORKING DIRECTORY (run
# the loop from the checkout — the relative script path this replaced had the
# same requirement), and the profile/port default to ~/.autoloop-chrome and
# 9222, overridable with --profile / --port or AUTOLOOP_CHROME_PROFILE /
# AUTOLOOP_CHROME_PORT.
restart_command = ["python3", "-m", "autoloop.browser.chrome_restart"]
# Minimum seconds between restart attempts — without it a genuinely dead
# transport becomes a restart loop. Failures whose restart THIS refused are
# charged to policy.max_browser_restart_skips, never to the failure budget.
restart_cooldown_seconds = 120.0

[policy]
max_iterations = 20
max_consecutive_failures = 3
# How many times ONE run may abandon a wedged conversation for a fresh chat in
# browser.project_url. A second rotation in one run usually means the fault is
# not the chat, so the default stops and asks instead of fanning out chats.
max_conversation_rotations = 1
# How many times ONE run may hand the reviewer role to
# conversation.fallback_provider after an exhausted allowance. One is enough:
# the useful move is primary -> fallback, and switching back would need a quota
# window to have reset, which does not happen inside a single run.
max_provider_switches = 1
# How many consecutive browser failures may go unrecovered because
# browser.restart_cooldown_seconds refused their restart. Those failures do NOT
# spend max_consecutive_failures above — a restart that never ran is no evidence
# that restarting fails — so this is what stops them retrying forever. Reaching
# it parks with a question naming the cooldown, rather than failing silently.
max_browser_restart_skips = 5
max_parse_retries = 2
max_policy_denials = 3
allow_commit = true
allow_push = true
# Direct pushes to these branches are denied. This repo commits to `main`
# today — either empty this list or set allow_protected_push = true once you
# trust the loop; the safe default stays on.
protected_branches = ["main", "master"]
allow_protected_push = false
# Merge a completed task's published side branch into the base and push the
# base, immediately after the task is retired. OFF by default: it is the only
# setting that moves the shared branch head with no operator in the loop.
#
# It is gated on exactly the same predicate `python -m autoloop merge-window`
# reports — no unpublished candidate bound to the current base, no executing
# phase — because moving the head strands any task whose reviewed candidate is
# pinned to it. When the gate is shut the merge is DEFERRED (recorded under
# <state_dir>/merge-deferrals/ and retried after the next completion), never
# forced and never parked. Conflicts abort cleanly and name the files.
#
# If your base branch is in protected_branches above, the merge still happens
# locally but the push is refused until allow_protected_push = true. That
# pairing is deliberate: turning this on is not by itself permission to push
# `main`.
#
# The SAME flag also enables the backlog sweep (`merge_sweep.py`): at startup,
# and from `python -m autoloop merge-backlog`, every completed task whose
# published branch is not an ancestor of the base head is merged, oldest
# publication first, stopping at the first branch that does not land. That is
# the half auto-merge cannot cover — a branch published before it existed has
# no completion event left to react to, which is how seven finished tasks sat
# unmerged on 2026-08-06. Same gate, same rules, same off-by-default.
auto_merge_enabled = false
# Note: force pushes and destructive git commands (reset/clean/rebase/...)
# cannot be enabled by ANY setting — the git whitelist has no knob for them.

[codex]
# The Codex CLI reviewer. Only read when a codex provider is selected above.
# Codex signs in with your ChatGPT plan (`codex login`) — no API key.
command = ["codex", "exec"]
# Flags that confine the reviewer, e.g. a read-only sandbox. Left EMPTY on
# purpose: the flag names could not be verified when this was written, and a
# guessed value would look like a control without being one. `doctor` warns
# while this is empty. Fill it in once you have checked `codex exec --help`.
sandbox_args = []
timeout_seconds = 900.0
# Where the CLI runs. Empty = your home directory. Never point this at the
# repository: the prompt is self-contained, so the reviewer needs no filesystem
# access, and running outside the checkout is a containment that holds no
# matter what the sandbox flags are called. `doctor` fails if it is inside.
working_dir = ""
# Substrings that mark an exhausted allowance in a FAILED invocation. Empty
# uses the built-in list. Every non-zero exit logs its return code and a
# stderr tail to the transcript, so the first real exhaustion shows you exactly
# what to add here — it is a config edit, not a code change.
quota_patterns = []

[conversation]
# Which LLMConversation adapter holds the reviewer role (see
# autoloop/conversation.py). Built in: "codex_cli" (Codex CLI, one process per
# turn — no DOM, so none of the browser transport's ambiguity machinery is even
# reachable) and "browser_chatgpt" (Playwright over CDP). Further adapters
# register here without orchestrator changes.
provider = "codex_cli"
# Where the reviewer role goes when `provider` reports its allowance exhausted.
# Empty disables failover and the loop parks instead.
#
# This pairing is worth the complexity for one specific reason: Codex draws on
# your ChatGPT plan's AGENTIC allowance (shared with ChatGPT Work and ChatGPT
# for Excel), while ordinary ChatGPT conversations draw on a SEPARATE quota. So
# the browser genuinely still works after Codex is spent — two transports and
# two budgets, not two doors onto the same one.
#
# The handover is bounded (policy.max_provider_switches), only happens with no
# captured reply in flight, and is recorded on the request and the response, so
# a `reviewed` stamp always says which reviewer produced it.
fallback_provider = "browser_chatgpt"

[executor]
# "audit" = the real Phase-3 audit executor (read-only claude-CLI subagents,
# Markdown-only output). "null" = record directives without executing (dry run;
# `run --null-executor` overrides per-invocation).
kind = "audit"

[audit]
# How subagents are launched (the Claude Code CLI in headless mode).
agent_command = ["claude"]
#
# `agent_timeout_seconds` was RETIRED on 2026-08-14. It bounded every agent by
# elapsed time, which cannot tell a large task from a wedged one — measured
# over 2026-08-05/06 it never once caught a hung agent and killed six agents
# mid-write, discarding up to 631 insertions at a time. It splits into three
# settings that mean different things.
#
# A config still naming it LOADS, and is handled explicitly rather than
# ignored: the value migrates onto `audit_agent_timeout_seconds` below (the one
# replacement that keeps its exact meaning) and the loop prints a notice on
# stderr, once per process, saying so. It does NOT carry over to the
# write-capable agent — that path is bounded by silence now, not by elapsed
# time. If `audit_agent_timeout_seconds` is also set, that wins and the notice
# says the legacy value was dropped. Delete the old key to silence the notice.
#
# READ-ONLY audit agents: an elapsed bound, the old key's exact meaning and
# value. Correct here — they change no files, so there is no progress to
# observe, and a timeout costs a re-run rather than destroying work.
audit_agent_timeout_seconds = 900.0
# WRITE-CAPABLE implement agents: how long the worker repository may show NO
# change at all before the agent counts as hung and is killed. A silence
# window, NOT a time budget — while files keep changing the agent keeps
# running, however long the task takes. Keep it generous: a long compile or a
# long test run is not a stall, and killing a healthy agent is the failure
# this replaced.
agent_stall_seconds = 1800.0
# The absolute backstop, for every agent, set far above any real task. It
# should effectively never fire; if it does, the report says so loudly and
# that is worth investigating rather than tuning away. Must be strictly above
# agent_stall_seconds, or the stall detector could never run.
agent_ceiling_seconds = 14400.0
max_parallel_agents = 3
# Safe validation commands run before the agents (argv lists; binaries are
# restricted to ruff/pytest/python/npm/npx/tsc — nothing that mutates). This is
# also the DEFAULT for post-commit validation: every task that declares no
# `validation` of its own has its committed tree graded by exactly this list,
# re-run in full on EVERY round, including the rounds that end in a revise.
#
# Each command is reported separately ("<command>: PASS" / ": FAIL (<digest>)"),
# so keeping the trees on separate lines keeps a failure attributable to one of
# them rather than to "pytest".
#
# Three things on the pytest lines are load-bearing:
#
#   * `-n auto` — pytest-xdist, one worker per core. Run serially the two suites
#     cost minutes of wall clock per round, paid against a change that usually
#     touches two or three files. Needs `pytest-xdist` installed in the
#     interpreter the loop invokes (root `requirements.txt` pulls it in via
#     `lexy-app/backend/requirements.txt`); without it pytest exits 4 on an
#     unrecognised argument and EVERY task fails validation, so check that
#     first if validation starts refusing everything at once.
#
#   * `-p no:cacheprovider` — pytest writes `.pytest_cache/` the moment a test
#     fails. Post-commit validation runs inside the task's own worker repo and
#     the gate after it refuses a worktree validation dirtied, so one failing
#     test produced two refusals instead of one (2026-08-03). Disabling the
#     plugin keeps a failing run from mutating the tree it is grading.
#
#   * the last line runs the `isolated` marker, alone and SERIALLY. `pytest.ini`
#     deselects that marker from every default run, so without a dedicated
#     command the coverage silently disappears; and it stays off `-n auto`
#     because the marker means "this test needs its own process", which is the
#     one thing a shared parallel run cannot give it.
#
# Both flags are also applied AT RUN TIME by `autoloop/validation.py`
# (`effective_validation_commands`), to whatever list is configured here, to a
# task's own declared `validation`, and to command lists persisted by sessions
# that dispatched earlier. Nothing re-reads this template after you copy it, so
# a config.toml written before a flag existed would otherwise never gain it.
# Spelling them out here anyway keeps the file readable as what it does; a
# command that already says `-n 0`, `-n 4` or `--numprocesses` is left exactly
# as written, and marker selection is never rewritten.
validation_commands = [
  ["ruff", "check", "."],
  ["python3", "-m", "pytest", "autoloop/tests", "-q", "-n", "auto", "-p", "no:cacheprovider"],
  ["python3", "-m", "pytest", "tests/", "-q", "-n", "auto", "-p", "no:cacheprovider"],
  ["python3", "-m", "pytest", "autoloop/tests", "-q", "-m", "isolated", "-p", "no:cacheprovider"],
]

[paths]
# Runtime state (state.json, tasks.json, transcript.jsonl, diagnostics/, PAUSE).
state_dir = ".autoloop"
# REQUIRED, no default. Where each task's isolated worker repository lives.
# MUST be an absolute path OUTSIDE this checkout, its .git (including the
# real git-common-dir a linked worktree's .git file points at), the state
# dir above, and the publisher repo/hooks dirs — `doctor` and every real run
# refuse otherwise, and never silently fall back to the old
# `<state_dir>/workers` location. `~` is expanded. See docs/SECURITY.md
# (Autoloop M1 finding #1): a worker repo nested inside the checkout is
# invisible to every git-based verification primitive scoped to it, so a
# write outside the worker repo but inside the checkout would go undetected.
workers_root = "~/.autoloop/workers"
# OPTIONAL. Absolute path to a file holding the DEDICATED TEST database
# credentials that post-writer validation runs under. Set this only when a
# task's declared validation needs a database (e.g. the backend suite); leave
# it unset and validation runs with no credentials at all.
#
# The file must define EXACTLY these six names and nothing else:
#
#   DB_HOST=127.0.0.1
#   DB_PORT=5432
#   DB_NAME=REPLACE_WITH_A_DEDICATED_TEST_DATABASE
#   DB_USER=REPLACE_ME
#   DB_PASSWORD=REPLACE_ME_MIN_8_CHARS
#   SECRET_KEY=REPLACE_ME_MIN_8_CHARS_JWT_SIGNING_KEY
#
# Refused, deliberately: any other key (so this can never become a channel
# for ANTHROPIC_API_KEY or another provider credential), a duplicate key, a
# missing key, a malformed line, an empty value, a symlink, a file not owned
# by you, any group/world permission bit (`chmod 600`), a path inside this
# checkout / the state dir / workers_root / the publisher dirs, and a DB_NAME
# equal to the application database name this repo declares in `.env.example`.
#
# The database is created, written to and deleted from by the test suite. Use
# a throwaway database, NOT the one the app runs on, and do NOT point this at
# your real `.env` — it holds provider keys this boundary exists to keep out.
# The write-capable agent subprocess has these variables explicitly removed
# from its environment and never learns this path.
# validation_env_file = "~/.autoloop/validation.env"
