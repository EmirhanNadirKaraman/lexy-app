# Autoloop configuration template.
# Copy to .autoloop/config.toml (the default path `python -m autoloop` reads)
# and fill in browser.conversation_url. Unknown keys are rejected, not ignored.

[browser]
# The ONE persistent ChatGPT conversation the loop uses. Open the dedicated
# profile, create a chat, copy its URL.
conversation_url = "https://chatgpt.com/c/REPLACE-ME"
# The ChatGPT project that conversation belongs to. Required ONLY for
# conversation rotation: when a chat becomes unusable, or two sends in a row are
# positively disproven, the loop opens ONE replacement chat here and rebinds the
# in-flight request to it. Leave empty to disable rotation entirely (the loop
# then parks for you instead). Set explicitly rather than derived from
# conversation_url — a guessed project URL opens chats somewhere you did not
# choose.
project_url = ""
# Chrome DevTools endpoint of the dedicated profile (see docs/AUTOLOOP.md for
# the launch command).
cdp_url = "http://127.0.0.1:9222"
# Every wait is bounded separately so a stuck channel fails fast with a
# specific diagnosis instead of hanging on one giant timeout.
composer_timeout_seconds = 30.0     # composer element ready
input_sync_timeout_seconds = 30.0   # editor really holds the whole request
send_ready_timeout_seconds = 30.0   # Send control enabled
submit_timeout_seconds = 60.0       # evidence the server accepted the turn
response_start_timeout_seconds = 120.0  # assistant begins answering
response_timeout_seconds = 900.0    # a started answer settles
reconcile_timeout_seconds = 30.0    # persisted-history check after a reload
poll_interval_seconds = 2.0
# The answer must be unchanged this long (and generation stopped) to count.
stability_seconds = 3.0

[policy]
max_iterations = 20
max_consecutive_failures = 3
# How many times ONE run may abandon a wedged conversation for a fresh chat in
# browser.project_url. A second rotation in one run usually means the fault is
# not the chat, so the default stops and asks instead of fanning out chats.
max_conversation_rotations = 1
max_parse_retries = 2
max_policy_denials = 3
allow_commit = true
allow_push = true
# Direct pushes to these branches are denied. This repo commits to `main`
# today — either empty this list or set allow_protected_push = true once you
# trust the loop; the safe default stays on.
protected_branches = ["main", "master"]
allow_protected_push = false
# Note: force pushes and destructive git commands (reset/clean/rebase/...)
# cannot be enabled by ANY setting — the git whitelist has no knob for them.

[conversation]
# Which LLMConversation adapter to use (see autoloop/conversation.py).
# "browser_chatgpt" is the only built-in; future adapters (Claude.ai, Gemini)
# register here without orchestrator changes.
provider = "browser_chatgpt"

[executor]
# "audit" = the real Phase-3 audit executor (read-only claude-CLI subagents,
# Markdown-only output). "null" = record directives without executing (dry run;
# `run --null-executor` overrides per-invocation).
kind = "audit"

[audit]
# How audit subagents are launched (the Claude Code CLI in headless mode).
agent_command = ["claude"]
agent_timeout_seconds = 900.0
max_parallel_agents = 3
# Safe validation commands run before the agents (argv lists; binaries are
# restricted to ruff/pytest/python/npm/npx/tsc — nothing that mutates).
validation_commands = [["ruff", "check", "."], ["python3", "-m", "pytest", "autoloop/tests", "-q"], ["python3", "-m", "pytest", "tests/", "-q"]]

[paths]
# Runtime state (state.json, tasks.json, transcript.jsonl, diagnostics/, PAUSE).
state_dir = ".autoloop"
# REQUIRED, no default. Where each task's isolated worker repository lives.
# MUST be an absolute path OUTSIDE this checkout, its .git (including the
# real git-common-dir a linked worktree's .git file points at), the state
# dir above, and the publisher repo/hooks dirs — `doctor` and every real run
# refuse otherwise, and never silently fall back to the old
# `<state_dir>/workers` location. `~` is expanded. See docs/SECURITY.md
# (Autoloop M1 finding #1): a worker repo nested inside the checkout is
# invisible to every git-based verification primitive scoped to it, so a
# write outside the worker repo but inside the checkout would go undetected.
workers_root = "~/.autoloop/workers"
# OPTIONAL. Absolute path to a file holding the DEDICATED TEST database
# credentials that post-writer validation runs under. Set this only when a
# task's declared validation needs a database (e.g. the backend suite); leave
# it unset and validation runs with no credentials at all.
#
# The file must define EXACTLY these six names and nothing else:
#
#   DB_HOST=127.0.0.1
#   DB_PORT=5432
#   DB_NAME=REPLACE_WITH_A_DEDICATED_TEST_DATABASE
#   DB_USER=REPLACE_ME
#   DB_PASSWORD=REPLACE_ME_MIN_8_CHARS
#   SECRET_KEY=REPLACE_ME_MIN_8_CHARS_JWT_SIGNING_KEY
#
# Refused, deliberately: any other key (so this can never become a channel
# for ANTHROPIC_API_KEY or another provider credential), a duplicate key, a
# missing key, a malformed line, an empty value, a symlink, a file not owned
# by you, any group/world permission bit (`chmod 600`), a path inside this
# checkout / the state dir / workers_root / the publisher dirs, and a DB_NAME
# equal to the application database name this repo declares in `.env.example`.
#
# The database is created, written to and deleted from by the test suite. Use
# a throwaway database, NOT the one the app runs on, and do NOT point this at
# your real `.env` — it holds provider keys this boundary exists to keep out.
# The write-capable agent subprocess has these variables explicitly removed
# from its environment and never learns this path.
# validation_env_file = "~/.autoloop/validation.env"
